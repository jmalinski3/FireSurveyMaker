# Copy this file to config.yaml and fill in your values. config.yaml is
# gitignored so your URLs never get committed.
#
# How to find the selectors:
#   1. Open your UKG login page in Chrome/Firefox.
#   2. Right-click the field (e.g. the password box) -> Inspect.
#   3. In DevTools, right-click the highlighted element -> Copy -> Copy selector.
#   4. Paste it below. Repeat for each field.
# The values below are GUESSES to get you started; verify every one against
# your actual UKG instance.

# The page you land on when not logged in (where username/password is entered).
# UKG Telestaff Cloud example:
#   https://<tenant>-tsc.prd.mykronos.com/telestaff/login
login_url: "https://CHANGEME.ukg.net/"

# Direct URL to your schedule/roster view once logged in.
roster_url: "https://CHANGEME.ukg.net/your/roster/path"

# Persistent browser profile. Stores cookies including the "remember this
# device for 7 days" trust cookie, so TOTP is only needed ~weekly. Keep private.
profile_dir: "./profile"

# Run without a visible browser window. Use --headful on the CLI for first-run setup.
headless: true

# Save a screenshot to ./debug on failure (may contain personal data; gitignored).
debug_screenshots: true

# Skip the run entirely if today's roster CSV already has data (reduces logins
# once the roster has been captured for the day).
skip_if_already_captured: true

selectors:
  username_input: "input[name='username']"
  password_input: "input[type='password']"
  submit_button: "button[type='submit']"
  # Optional. Some flows (UKG Telestaff) put an MFA method-selection page with a
  # "Continue" button between the password page and the code-entry page. Set the
  # selector for that Continue button here. Leave commented/blank if your login
  # goes straight from password to the code field.
  mfa_continue_button: "button[type='submit']"
  totp_input: "input[name='otp']"
  remember_device_checkbox: "input[type='checkbox']"
  totp_submit_button: "button[type='submit']"
  # Element whose presence means the roster has finished loading. For UKG
  # Telestaff this is a position row in the roster tree (#rosterFixedContent).
  # The scraper walks that tree directly, so no separate table selector exists.
  roster_ready_marker: "li.idPosition"

# Optional. Selectors for post-login popups/interstitials to close before the
# roster loads. UKG Telestaff sometimes routes a fresh login through a "contact
# log" page (/telestaff/checkContactLog) that must be dismissed first. List the
# close/acknowledge button selector(s); each is clicked if present. Leave the
# list empty ([]) if your instance has no such popup.
dismiss_selectors:
  - "button.close"

output:
  dir: "./output"
  filename: "roster_{date}.csv"  # {date} -> YYYY-MM-DD of the run

timeouts:
  navigation_ms: 30000
  element_ms: 15000
